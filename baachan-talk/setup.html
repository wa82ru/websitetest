<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>ばあちゃんトーク 端末登録</title><style>body{font:20px system-ui;background:#111827;color:white;max-width:600px;margin:40px auto;padding:20px}input,button{box-sizing:border-box;width:100%;font:inherit;padding:16px;margin-top:12px;border-radius:12px}button{background:#93c5fd;border:0}p{line-height:1.6}</style></head><body><h1>この端末を登録</h1><p>最初の1回だけ、専用の登録コードを入力してください。普段の会話画面ではログイン操作は不要です。</p><label>登録コード<input id="key" type="password" autocomplete="off" spellcheck="false"></label><button id="register">この端末を登録</button><p id="result" role="status"></p><script src="./mail-config.js"></script><script>
(()=>{'use strict';const key=document.getElementById('key'),result=document.getElementById('result'),button=document.getElementById('register');if(location.hash){key.value=decodeURIComponent(location.hash.slice(1));history.replaceState(null,'',location.pathname);}button.onclick=async()=>{const value=key.value.trim();if(value.length<32){result.textContent='登録コードを確認してください。';return;}button.disabled=true;result.textContent='接続を確認しています…';try{const r=await fetch(window.BT_MAIL_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action:'check',key:value})});const j=await r.json();if(!r.ok||!j.ok)throw Error();localStorage.setItem('bt-mail-device',JSON.stringify({key:value}));key.value='';result.textContent='登録しました。会話画面を開きます。';location.replace('./');}catch{result.textContent='登録できませんでした。登録コードと通信を確認してください。';button.disabled=false;}};})();
</script></body></html>
