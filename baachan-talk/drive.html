<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ばあちゃんトーク</title><meta name="theme-color" content="#111827"><style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:white;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}main{max-width:1100px;margin:auto;padding:12px}.top,.controls,.settings{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}.top{justify-content:space-between;margin:6px 0 12px}.top h1{margin:0;font-size:22px}.status{font-size:14px;color:#cbd5e1}.screen{min-height:300px;height:60dvh;background:#030712;color:white;border:2px solid #334155;border-radius:20px;padding:24px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:auto}.screen.light{background:#fffdf5;color:#171717}.text{font-size:var(--fontSize,60px);font-weight:750;line-height:1.4;overflow-wrap:anywhere;white-space:pre-wrap;width:100%}.interim{opacity:.65}.hint{font-size:26px;color:#94a3b8}button{font:700 18px system-ui;border:0;border-radius:15px;padding:15px 22px;background:#334155;color:white;min-height:56px}button.main{background:#93c5fd;color:#0f172a;min-width:230px}button.main.active{background:#fecaca;color:#450a0a}.controls,.settings{margin-top:12px}.settings{background:#1e293b;padding:16px;border-radius:15px;justify-content:space-around}label{display:flex;align-items:center;gap:8px}input[type=range]{accent-color:#93c5fd;width:160px}input[type=checkbox]{height:22px;width:22px}.notice{line-height:1.5;color:#cbd5e1;font-size:14px}.error{color:#fecaca}@media(max-width:540px){.screen{height:57dvh}.controls .main{width:100%}.controls button:not(.main){flex:1}}
 .drivePanel{background:#17253a;border:1px solid #40516c;border-radius:15px;padding:15px;margin-top:16px}.drivePanel summary{cursor:pointer;font-weight:700}.drivePanel input[type=text]{width:100%;max-width:530px;padding:12px;border-radius:10px;border:1px solid #7b8da7;background:#fff;color:#111;font-size:15px}.drivePanel p{color:#cbd5e1;line-height:1.5;font-size:14px}</style></head><body><main><div class="top"><h1>🌷 ばあちゃんトーク</h1><span class="status" id="status">待機中</span></div><div id="screen" class="screen"><div class="text" id="text"><span class="hint">「話しはじめる」を押してください</span></div></div><div class="controls"><button class="main" id="toggle">🎤 話しはじめる</button><button id="clear">↺ 文字を消す</button><button id="fullscreen">⛶ 全画面</button></div><div class="settings"><label>文字サイズ <input type="range" min="32" max="100" step="2" value="60" id="size"><output id="sizeOut">60px</output></label><label><input type="checkbox" id="light">白背景</label><label><input type="checkbox" id="keep">表示を積み重ねる</label></div><div hidden aria-hidden="true"><span id="driveStatus"></span><button id="driveLogin" tabindex="-1"></button><button id="driveRetry" tabindex="-1"></button></div><p class="notice" id="notice">短い文章で、ゆっくり話してください。</p><p class="notice">マイクの許可が必要です。ブラウザーの音声認識サービスへ音声が送信される場合があります。Safariのバージョンによっては動かないことがあります。</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;let recog=null,want=false,active=false,opening=false,epoch=0,timer=null,finalText='',interimText='';const toggle=$('toggle'),notice=$('notice'),status=$('status');function render(){const box=$('text');box.replaceChildren();if(!finalText&&!interimText){const a=document.createElement('span');a.className='hint';a.textContent=want?'話しかけてください':'「話しはじめる」を押してください';box.append(a);return}box.append(document.createTextNode(finalText));if(interimText){let span=document.createElement('span');span.className='interim';span.textContent=(finalText?'\n':'')+interimText;box.append(span)}}function info(s,err=false){notice.textContent=s;notice.classList.toggle('error',err)}function showState(s){status.textContent=s;toggle.textContent=want?'■ 会話を止める':'🎤 話しはじめる';toggle.classList.toggle('active',want)}function stop(){window.BTDrive?.stop();want=false;epoch++;if(timer)clearTimeout(timer);timer=null;if(recog)try{recog.abort()}catch(e){}recog=null;active=false;opening=false;interimText='';showState('待機中');render();info('停止しました。文字はそのまま表示されています。')}function listen(){if(!want||opening||active)return;opening=true;const myEpoch=epoch;try{const r=new Recognition();recog=r;r.lang='ja-JP';r.continuous=true;r.interimResults=true;r.maxAlternatives=1;r.onstart=()=>{if(myEpoch!==epoch)return;opening=false;active=true;showState('🎤 聞き取り中');info('マイクが有効です。話しかけてください。')};r.onresult=e=>{if(myEpoch!==epoch)return;let completed='',temporary='';for(let i=e.resultIndex;i<e.results.length;i++){const txt=e.results[i][0]?.transcript||'';if(e.results[i].isFinal)completed+=txt;else temporary+=txt}if(completed.trim()){window.BTDrive?.final(completed.trim());finalText=$('keep').checked?(finalText?finalText+'\n':'')+completed.trim():completed.trim()}interimText=temporary.trim();render()};r.onerror=e=>{if(myEpoch!==epoch)return;const code=e.error||'unknown';if(['not-allowed','service-not-allowed','audio-capture','language-not-supported'].includes(code)){want=false;window.BTDrive?.stop();info('音声認識を利用できません（'+code+'）。マイク許可・Safariの対応状況を確認してください。',true)}else if(code==='no-speech')info('聞き取れませんでした。再度話してください。');else info('認識が一時停止しました（'+code+'）。',true);showState(want?'再接続中':'待機中')};r.onend=()=>{if(myEpoch!==epoch)return;active=false;opening=false;interimText='';render();showState(want?'再接続中':'待機中');if(want)timer=setTimeout(()=>{if(myEpoch===epoch)listen()},700)};r.start();showState('起動中')}catch(err){opening=false;want=false;window.BTDrive?.stop();showState('待機中');info('音声認識を開始できませんでした。'+(err.message||''),true)}}toggle.onclick=async()=>{if(want){stop();return}if(!Recognition){info('このブラウザーでは音声認識APIが使えません。別の音声認識方式が必要です。',true);return}if(!isSecureContext){info('HTTPSでページを開いてください。',true);return}if(!window.BTDrive){info('準備中です。少し待ってもう一度押してください。',true);return}toggle.disabled=true;let ready=false;try{ready=await window.BTDrive.prepare()}finally{toggle.disabled=false}if(!ready){info('接続を完了できませんでした。もう一度「話しはじめる」を押してください。',true);return}want=true;window.BTDrive.start();epoch++;if(!$('keep').checked)finalText='';interimText='';render();listen()};$('clear').onclick=()=>{finalText='';interimText='';render()};$('size').oninput=e=>{$('text').style.setProperty('--fontSize',e.target.value+'px');$('sizeOut').textContent=e.target.value+'px'};$('light').onchange=e=>$('screen').classList.toggle('light',e.target.checked);$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if($('screen').requestFullscreen)await $('screen').requestFullscreen();else info('このSafariでは全画面表示に対応していません。')}catch(e){info('全画面表示は利用できません。')}};if(!Recognition)info('この環境はWeb Speech APIに対応していません。別方式への切り替えが必要です。',true);
})();</script><script src="https://accounts.google.com/gsi/client" async defer></script><script src="./drive-sync.js?v=20261025-autosave"></script></body></html>
